# Installed as /etc/nginx/conf.d/00-englishbite-http.conf (http-level settings).

# /catalog is ~300 KB of JSON and the app refetches it on every resume - compress it.
gzip on;
gzip_types application/json;
gzip_proxied any;
gzip_min_length 1024;

# Login/signup/change-password/delete all hash with PBKDF2 (CPU-heavy) and are the only
# endpoints worth guessing against: cap each IP at 10/min with a burst of 10.
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
# Crash reports are tiny and rare; this just stops anyone filling the disk with them.
limit_req_zone $binary_remote_addr zone=telemetry:10m rate=6r/m;
limit_req_status 429;
